<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KNHS DocumentTrack V4</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f3f5f8;color:#182235}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#071b34,#174f7a)}
.loginbox{width:min(430px,92vw);background:#fff;border-radius:16px;padding:32px;box-shadow:0 18px 60px #0005}.seal{width:62px;height:62px;border:3px solid #0b2b4b;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#0b2b4b;margin-bottom:15px}.loginbox h1{margin:0 0 5px}.muted{color:#697586}.small{font-size:11px}.loginbox label,.form label{display:block;font-size:11px;font-weight:700;margin-top:12px}.loginbox input,.form input,.form select,.form textarea,.search input,.search select{width:100%;padding:10px;border:1px solid #d4dae4;border-radius:8px;background:#fff;margin-top:5px}.loginbox button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:8px;background:#0b2b4b;color:white;font-weight:700}
.app{display:none;min-height:100vh}.side{position:fixed;left:0;top:0;bottom:0;width:250px;background:#09233f;color:#fff;padding:18px 14px;z-index:5}.brand{display:flex;gap:10px;align-items:center;border-bottom:1px solid #ffffff1c;padding:5px 5px 18px;margin-bottom:14px}.brand .seal{width:43px;height:43px;border-color:#fff;color:#fff;margin:0;font-size:10px}.brand b{font-size:12px}.brand small{display:block;color:#9fb2c8;font-size:9px}.nav{width:100%;display:block;text-align:left;border:0;background:none;color:#c8d3e1;padding:11px 12px;border-radius:8px;margin:3px 0}.nav:hover,.nav.active{background:#ffffff18;color:#fff}.sidefoot{position:absolute;bottom:18px;left:20px;right:20px;font-size:10px;color:#9fb2c8;line-height:1.55}.main{margin-left:250px;padding:25px 30px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top h1{margin:0;font-size:26px}.top p{margin:4px 0;color:#697586;font-size:12px}.primary,.secondary,.danger{border:0;border-radius:8px;padding:10px 14px;font-weight:700}.primary{background:#0b2b4b;color:#fff}.secondary{background:#fff;border:1px solid #d4dae4}.danger{background:#b42318;color:#fff}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid #e1e6ee;border-radius:11px;padding:17px}.card span{font-size:10px;color:#697586}.card b{display:block;font-size:26px;margin-top:5px}.dangertext b{color:#b42318}.panel{margin-top:16px}.panel h2{font-size:17px;margin:0 0 14px}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.search{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}.search input{flex:1;min-width:220px}.search select{width:auto}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid #edf0f4;text-align:left;font-size:12px;white-space:nowrap}th{font-size:10px;color:#697586;text-transform:uppercase}.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:10px;font-weight:700}.received{background:#e6f0ff;color:#2455a4}.process{background:#fff2cf;color:#8a6100}.released{background:#e3f7eb;color:#167247}.closed{background:#edf0f4;color:#596579}.urgent{background:#fee4e2;color:#b42318}.high{background:#fff0d6;color:#9a6700}.normal{background:#edf2f7;color:#536173}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}.form textarea{min-height:85px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:17px}.detailgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kv{background:#f7f9fb;border-radius:8px;padding:10px}.kv small{display:block;color:#748096}.kv b{display:block;font-size:12px;margin-top:3px}.timeline{border-left:2px solid #dfe5ed;padding-left:14px}.event{margin-bottom:15px}.event b{display:block}.event small{color:#748096}.attachment{background:#f7f9fb;padding:9px;border-radius:7px;margin:5px 0}.flash{position:fixed;right:22px;top:18px;z-index:20;padding:11px 15px;border-radius:8px;background:#e7f8ef;color:#176b45;box-shadow:0 5px 20px #0002}.modal{position:fixed;inset:0;background:#0007;display:none;place-items:center;z-index:15;padding:20px}.modalbox{background:#fff;border-radius:13px;width:min(700px,96vw);max-height:90vh;overflow:auto;padding:20px}.modalhead{display:flex;justify-content:space-between}.modalhead button{border:0;background:none;font-size:22px}.empty{text-align:center;padding:28px;color:#697586}.hidden{display:none!important}
@media(max-width:950px){.side{width:205px}.main{margin-left:205px}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.side{position:static;width:100%;height:auto}.sidefoot{position:static;margin-top:20px}.main{margin:0;padding:15px}.grid,.detailgrid{grid-template-columns:1fr}.wide{grid-column:auto}.cards{grid-template-columns:1fr 1fr}.top{align-items:flex-start;gap:10px}}
@media print{.side,.top button,.search,.actions,.modal{display:none!important}.main{margin:0}.panel{box-shadow:none}}
</style>
</head>
<body>
<div id="login" class="login"><div class="loginbox">
<div class="seal">KNHS</div><h1>DocumentTrack V4</h1><p class="muted">Kauswagan National High School<br>Standalone Records Management System</p>
<div id="loginMsg"></div><label>Username<input id="loginUser" value="admin"></label><label>Password<input id="loginPass" type="password" value="admin123"></label><button onclick="login()">Sign In</button>
<p class="small muted">Initial account: admin / admin123</p></div></div>

<div id="app" class="app">
<aside class="side"><div class="brand"><div class="seal">KNHS</div><div><b>KAUSWAGAN NATIONAL<br>HIGH SCHOOL</b><small>DOCUMENTTRACK V4</small></div></div>
<button class="nav active" onclick="show('dashboard',this)">▦ Dashboard</button>
<button class="nav" onclick="show('registry',this)">▤ Document Registry</button>
<button class="nav" onclick="show('reports',this)">▥ Reports</button>
<button class="nav" onclick="show('users',this)">♙ User Management</button>
<button class="nav" onclick="show('settings',this)">⚙ School Settings</button>
<button class="nav" onclick="show('backup',this)">💾 Backup / Restore</button>
<div class="sidefoot"><span id="schoolFoot"></span><br><br><span id="who"></span><br><button class="nav" style="padding-left:0" onclick="logout()">↪ Sign out</button></div></aside>
<main class="main">
<div class="top"><div><h1 id="pageTitle">Dashboard</h1><p>School Records and Document Tracking System</p></div><button class="primary" onclick="openDoc()">＋ Register Document</button></div>
<section id="dashboard" class="page"></section><section id="registry" class="page hidden"></section><section id="reports" class="page hidden"></section><section id="users" class="page hidden"></section><section id="settings" class="page hidden"></section><section id="backup" class="page hidden"></section>
</main></div>

<div id="docModal" class="modal"><div class="modalbox"><div class="modalhead"><h2 id="docModalTitle">Register Document</h2><button onclick="closeModal('docModal')">×</button></div><div id="docForm"></div></div></div>
<div id="viewModal" class="modal"><div class="modalbox"><div class="modalhead"><h2 id="viewTitle"></h2><button onclick="closeModal('viewModal')">×</button></div><div id="viewBody"></div></div></div>
<div id="routeModal" class="modal"><div class="modalbox"><div class="modalhead"><h2>Record Document Movement</h2><button onclick="closeModal('routeModal')">×</button></div><form class="form grid" onsubmit="saveMovement(event)"><input type="hidden" id="routeId"><label>Route To<input id="routeOffice"></label><label>Received By<input id="routeCustodian"></label><label>Action<select id="routeAction"><option>Routed</option><option>Received</option><option>For Review</option><option>For Approval</option><option>Released</option><option>Returned</option></select></label><label>Status<select id="routeStatus"><option>In Process</option><option>Received</option><option>Released</option><option>Closed</option></select></label><label class="wide">Remarks<textarea id="routeRemarks"></textarea></label><div class="actions wide"><button type="button" class="secondary" onclick="closeModal('routeModal')">Cancel</button><button class="primary">Save Movement</button></div></form></div></div>

<script>
const KEY='KNHS_DocumentTrack_V4_DB';
let db, currentUser;
const defaultDB={school:{name:'Kauswagan National High School',id:'315411',division:'Cagayan de Oro City',region:'Region X'},users:[{id:1,username:'admin',name:'System Administrator',role:'Administrator',password:'admin123',active:true}],documents:[],audit:[]};
function load(){try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaultDB)}catch(e){db=structuredClone(defaultDB)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function uid(){return Date.now()+Math.floor(Math.random()*999)}
function today(){return new Date().toISOString().slice(0,10)}
function flash(t){let x=document.createElement('div');x.className='flash';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}
function audit(action,details=''){db.audit.unshift({id:uid(),user:currentUser?.username||'system',action,details,at:new Date().toLocaleString()});save()}
function login(){let u=db.users.find(x=>x.username===document.getElementById('loginUser').value&&x.active);if(u&&u.password===document.getElementById('loginPass').value){currentUser=u;document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';initUI();audit('LOGIN');}else document.getElementById('loginMsg').innerHTML='<div class="flash" style="position:static;margin:8px 0;background:#fee4e2;color:#a11">Invalid username or password.</div>'}
function logout(){audit('LOGOUT');currentUser=null;document.getElementById('app').style.display='none';document.getElementById('login').style.display='grid'}
function initUI(){document.getElementById('schoolFoot').innerHTML=`${esc(db.school.name)}<br>School ID: ${esc(db.school.id)}<br>${esc(db.school.division)} • ${esc(db.school.region)}`;document.getElementById('who').textContent=`${currentUser.name} • ${currentUser.role}`;show('dashboard',document.querySelector('.nav'))}
function show(id,btn){document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');let titles={dashboard:'Dashboard',registry:'Document Registry',reports:'Reports',users:'User Management',settings:'School Settings',backup:'Backup / Restore'};document.getElementById('pageTitle').textContent=titles[id];render(id)}
function render(id){if(id==='dashboard')renderDashboard();if(id==='registry')renderRegistry();if(id==='reports')renderReports();if(id==='users')renderUsers();if(id==='settings')renderSettings();if(id==='backup')renderBackup()}
function badge(s){return `<span class="badge ${s==='In Process'?'process':s.toLowerCase().replace(' ','-')}">${esc(s)}</span>`}
function priority(p){return `<span class="badge ${p.toLowerCase()}">${esc(p)}</span>`}
function renderDashboard(){let docs=db.documents,total=docs.length,rec=docs.filter(d=>d.status==='Received').length,proc=docs.filter(d=>d.status==='In Process').length,rel=docs.filter(d=>d.status==='Released').length,over=docs.filter(d=>d.due&&d.due<today()&&!['Released','Closed'].includes(d.status)).length;let recent=docs.slice().sort((a,b)=>b.id-a.id).slice(0,8);document.getElementById('dashboard').innerHTML=`<div class="cards"><div class="card"><span>TOTAL DOCUMENTS</span><b>${total}</b></div><div class="card"><span>RECEIVED</span><b>${rec}</b></div><div class="card"><span>IN PROCESS</span><b>${proc}</b></div><div class="card"><span>RELEASED</span><b>${rel}</b></div><div class="card dangertext"><span>OVERDUE</span><b>${over}</b></div></div><div class="panel"><div class="panelhead"><h2>Recent Documents</h2><button class="secondary" onclick="show('registry',document.querySelectorAll('.nav')[1])">View Registry</button></div><div class="tablewrap"><table><tr><th>Control No.</th><th>Subject</th><th>Received</th><th>Office</th><th>Status</th><th>Priority</th></tr>${recent.map(d=>`<tr><td><a href="#" onclick="viewDoc(${d.id});return false"><b>${esc(d.control)}</b></a></td><td>${esc(d.subject)}</td><td>${esc(d.received)}</td><td>${esc(d.office||'—')}</td><td>${badge(d.status)}</td><td>${priority(d.priority)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No documents registered.</td></tr>'}</table></div></div>`}
function renderRegistry(){let docs=db.documents.slice().sort((a,b)=>b.id-a.id);document.getElementById('registry').innerHTML=`<div class="search"><input id="searchBox" placeholder="Search control no., subject, sender, office..." oninput="filterDocs()"><select id="statusFilter" onchange="filterDocs()"><option value="">All Statuses</option><option>Received</option><option>In Process</option><option>Released</option><option>Closed</option></select><select id="typeFilter" onchange="filterDocs()"><option value="">All Types</option><option>Incoming Letter</option><option>Memorandum</option><option>Request</option><option>Procurement</option><option>Financial</option><option>Personnel</option><option>Report</option><option>Other</option></select><button class="secondary" onclick="exportCSV()">Export CSV</button></div><div class="panel"><div class="tablewrap"><table id="docTable"><thead><tr><th>Control No.</th><th>Subject / Type</th><th>Sender</th><th>Received</th><th>Due</th><th>Office / Custodian</th><th>Status</th><th>Priority</th><th>Actions</th></tr></thead><tbody>${docs.map(d=>docRow(d)).join('')||'<tr><td colspan="9" class="empty">No records.</td></tr>'}</tbody></table></div></div>`}
function docRow(d){return `<tr data-text="${esc((d.control+' '+d.subject+' '+d.sender+' '+d.office+' '+d.custodian+' '+d.reference).toLowerCase())}" data-status="${esc(d.status)}" data-type="${esc(d.type)}"><td><a href="#" onclick="viewDoc(${d.id});return false"><b>${esc(d.control)}</b></a><br><small class="muted">${esc(d.reference||'')}</small></td><td>${esc(d.subject)}<br><small class="muted">${esc(d.type)}</small></td><td>${esc(d.sender||'')}</td><td>${esc(d.received||'')}</td><td>${esc(d.due||'—')}</td><td>${esc(d.office||'—')}<br><small class="muted">${esc(d.custodian||'')}</small></td><td>${badge(d.status)}</td><td>${priority(d.priority)}</td><td><button class="secondary" onclick="routeDoc(${d.id})">Route</button> <button class="secondary" onclick="openDoc(${d.id})">Edit</button></td></tr>`}
function filterDocs(){let q=(document.getElementById('searchBox').value||'').toLowerCase(),s=document.getElementById('statusFilter').value,t=document.getElementById('typeFilter').value;document.querySelectorAll('#docTable tbody tr[data-text]').forEach(r=>{r.style.display=(!q||r.dataset.text.includes(q))&&(!s||r.dataset.status===s)&&(!t||r.dataset.type===t)?'':'none'})}
function nextControl(){let y=new Date().getFullYear(),n=db.documents.filter(d=>d.control.startsWith('KNHS-'+y+'-')).length+1;while(db.documents.some(d=>d.control===`KNHS-${y}-${String(n).padStart(4,'0')}`))n++;return `KNHS-${y}-${String(n).padStart(4,'0')}`}
function openDoc(id=null){let d=id?db.documents.find(x=>x.id===id):null;document.getElementById('docModalTitle').textContent=d?'Edit Document':'Register Document';document.getElementById('docForm').innerHTML=`<form class="form grid" onsubmit="saveDoc(event,${id||0})"><label>Control No.*<input id="f_control" value="${esc(d?.control||nextControl())}" ${d?'readonly':''}></label><label>Reference / Tracking No.<input id="f_reference" value="${esc(d?.reference||'')}"></label><label>Document Subject / Title*<input id="f_subject" required value="${esc(d?.subject||'')}"></label><label>Document Type<select id="f_type">${['Incoming Letter','Memorandum','Request','Procurement','Financial','Personnel','Report','Other'].map(x=>`<option ${d?.type===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Sender / Requestor<input id="f_sender" value="${esc(d?.sender||'')}"></label><label>Originating Office<input id="f_origin" value="${esc(d?.origin||'')}"></label><label>Date Received<input type="date" id="f_received" value="${d?.received||today()}"></label><label>Due Date<input type="date" id="f_due" value="${d?.due||''}"></label><label>Priority<select id="f_priority">${['Normal','High','Urgent'].map(x=>`<option ${d?.priority===x||(!d&&x==='Normal')?'selected':''}>${x}</option>`).join('')}</select></label><label>Status<select id="f_status">${['Received','In Process','Released','Closed'].map(x=>`<option ${d?.status===x||(!d&&x==='Received')?'selected':''}>${x}</option>`).join('')}</select></label><label>Current Office<input id="f_office" value="${esc(d?.office||'')}"></label><label>Current Custodian<input id="f_custodian" value="${esc(d?.custodian||'')}"></label><label class="wide">Remarks<textarea id="f_remarks">${esc(d?.remarks||'')}</textarea></label><div class="actions wide"><button type="button" class="secondary" onclick="closeModal('docModal')">Cancel</button><button class="primary">Save Document</button></div></form>`;document.getElementById('docModal').style.display='grid'}
function saveDoc(e,id){e.preventDefault();let d=id?db.documents.find(x=>x.id===id):null;let obj={id:id||uid(),control:document.getElementById('f_control').value,reference:document.getElementById('f_reference').value,subject:document.getElementById('f_subject').value,type:document.getElementById('f_type').value,sender:document.getElementById('f_sender').value,origin:document.getElementById('f_origin').value,received:document.getElementById('f_received').value,due:document.getElementById('f_due').value,priority:document.getElementById('f_priority').value,status:document.getElementById('f_status').value,office:document.getElementById('f_office').value,custodian:document.getElementById('f_custodian').value,remarks:document.getElementById('f_remarks').value,createdBy:d?.createdBy||currentUser.username,created:d?.created||new Date().toLocaleString(),updated:new Date().toLocaleString(),movements:d?.movements||[],attachments:d?.attachments||[]};if(!d){obj.movements.push({at:new Date().toLocaleString(),from:obj.origin,to:obj.office,receivedBy:obj.custodian,action:'Document received',status:obj.status,remarks:obj.remarks,by:currentUser.username});db.documents.push(obj);audit('CREATE_DOCUMENT',obj.control)}else{Object.assign(d,obj);audit('UPDATE_DOCUMENT',obj.control)}save();closeModal('docModal');flash('Document saved successfully.');render('registry')}
function viewDoc(id){let d=db.documents.find(x=>x.id===id);if(!d)return;document.getElementById('viewTitle').textContent=d.control;document.getElementById('viewBody').innerHTML=`<div class="panel" style="margin:0"><h2>${esc(d.subject)}</h2><div class="detailgrid"><div class="kv"><small>Type</small><b>${esc(d.type)}</b></div><div class="kv"><small>Sender</small><b>${esc(d.sender||'—')}</b></div><div class="kv"><small>Received</small><b>${esc(d.received||'—')}</b></div><div class="kv"><small>Due</small><b>${esc(d.due||'—')}</b></div><div class="kv"><small>Priority</small><b>${priority(d.priority)}</b></div><div class="kv"><small>Status</small><b>${badge(d.status)}</b></div><div class="kv"><small>Current Office</small><b>${esc(d.office||'—')}</b></div><div class="kv"><small>Custodian</small><b>${esc(d.custodian||'—')}</b></div><div class="kv"><small>Originating Office</small><b>${esc(d.origin||'—')}</b></div><div class="kv"><small>Remarks</small><b>${esc(d.remarks||'—')}</b></div></div></div><div class="panel"><div class="panelhead"><h2>Movement History</h2><button class="primary" onclick="closeModal('viewModal');routeDoc(${d.id})">＋ Route</button></div><div class="timeline">${(d.movements||[]).slice().reverse().map(m=>`<div class="event"><b>${esc(m.action)} — ${esc(m.status)}</b><small>${esc(m.at)} · ${esc(m.from||'—')} → ${esc(m.to||'—')} · ${esc(m.receivedBy||'—')} · ${esc(m.by||'')}</small><div>${esc(m.remarks||'')}</div></div>`).join('')||'<p class="muted">No movement history.</p>'}</div></div><div class="panel"><h2>Attachments</h2><input type="file" id="attachFile" onchange="attachFile(${d.id})"><div id="attList">${(d.attachments||[]).map(a=>`<div class="attachment">📎 <a href="${a.data}" download="${esc(a.name)}">${esc(a.name)}</a> <small class="muted">— ${esc(a.at)}</small></div>`).join('')||'<p class="muted">No attachments.</p>'}</div></div>`;document.getElementById('viewModal').style.display='grid'}
function attachFile(id){let f=document.getElementById('attachFile').files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let d=db.documents.find(x=>x.id===id);d.attachments=d.attachments||[];d.attachments.push({name:f.name,data:r.result,at:new Date().toLocaleString(),by:currentUser.username});try{save();audit('ATTACH_FILE',d.control);viewDoc(id);flash('Attachment saved.')}catch(e){alert('The browser storage limit was reached. Use Backup/Restore or keep attachments small.')}};r.readAsDataURL(f)}
function routeDoc(id){document.getElementById('routeId').value=id;document.getElementById('routeOffice').value='';document.getElementById('routeCustodian').value='';document.getElementById('routeRemarks').value='';document.getElementById('routeModal').style.display='grid'}
function saveMovement(e){e.preventDefault();let id=+document.getElementById('routeId').value,d=db.documents.find(x=>x.id===id),m={at:new Date().toLocaleString(),from:d.office,to:document.getElementById('routeOffice').value,receivedBy:document.getElementById('routeCustodian').value,action:document.getElementById('routeAction').value,status:document.getElementById('routeStatus').value,remarks:document.getElementById('routeRemarks').value,by:currentUser.username};d.movements.push(m);d.office=m.to;d.custodian=m.receivedBy;d.status=m.status;d.remarks=m.remarks;d.updated=new Date().toLocaleString();save();audit('ROUTE_DOCUMENT',d.control+' — '+m.action);closeModal('routeModal');flash('Movement recorded.');render('registry')}
function closeModal(id){document.getElementById(id).style.display='none'}
function renderReports(){let docs=db.documents;document.getElementById('reports').innerHTML=`<div class="panel"><div class="actions" style="justify-content:flex-start"><button class="primary" onclick="exportCSV()">Export CSV</button><button class="secondary" onclick="window.print()">Print</button></div><div class="tablewrap"><table><tr><th>Control No.</th><th>Subject</th><th>Type</th><th>Received</th><th>Due</th><th>Status</th><th>Office</th></tr>${docs.map(d=>`<tr><td>${esc(d.control)}</td><td>${esc(d.subject)}</td><td>${esc(d.type)}</td><td>${esc(d.received)}</td><td>${esc(d.due||'—')}</td><td>${esc(d.status)}</td><td>${esc(d.office||'—')}</td></tr>`).join('')}</table></div></div>`}
function renderUsers(){let admin=currentUser.role==='Administrator';document.getElementById('users').innerHTML=admin?`<div class="panel form"><h2>Create User</h2><form class="grid" onsubmit="createUser(event)"><label>Username<input id="u_user" required></label><label>Full Name<input id="u_name" required></label><label>Password<input id="u_pass" required></label><label>Role<select id="u_role"><option>Records Officer</option><option>Staff</option><option>Administrator</option></select></label><div class="actions wide"><button class="primary">Create User</button></div></form></div><div class="panel"><h2>Users</h2><table><tr><th>Username</th><th>Name</th><th>Role</th><th>Status</th><th>Action</th></tr>${db.users.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.name)}</td><td>${esc(u.role)}</td><td>${u.active?'Active':'Disabled'}</td><td>${u.id===currentUser.id?'Current account':`<button class="secondary" onclick="toggleUser(${u.id})">${u.active?'Disable':'Enable'}</button>`}</td></tr>`).join('')}</table></div><div class="panel"><h2>Audit Trail</h2><div class="tablewrap"><table><tr><th>Date/Time</th><th>User</th><th>Action</th><th>Details</th></tr>${db.audit.slice(0,100).map(a=>`<tr><td>${esc(a.at)}</td><td>${esc(a.user)}</td><td>${esc(a.action)}</td><td>${esc(a.details)}</td></tr>`).join('')}</table></div></div>`:'<div class="panel"><p>Only Administrators can manage users.</p></div>'}
function createUser(e){e.preventDefault();let username=u_user.value.trim();if(db.users.some(u=>u.username===username)){alert('Username already exists.');return}db.users.push({id:uid(),username,name:u_name.value,role:u_role.value,password:u_pass.value,active:true});save();audit('CREATE_USER',username);e.target.reset();flash('User created.');renderUsers()}
function toggleUser(id){let u=db.users.find(x=>x.id===id);u.active=!u.active;save();audit('TOGGLE_USER',u.username);renderUsers()}
function renderSettings(){let admin=currentUser.role==='Administrator';document.getElementById('settings').innerHTML=admin?`<form class="panel form" onsubmit="saveSettings(event)"><div class="grid"><label>School Name<input id="s_name" value="${esc(db.school.name)}"></label><label>School ID<input id="s_id" value="${esc(db.school.id)}"></label><label>Division<input id="s_div" value="${esc(db.school.division)}"></label><label>Region<input id="s_reg" value="${esc(db.school.region)}"></label></div><div class="actions"><button class="primary">Save Settings</button></div></form>`:'<div class="panel"><p>Only Administrators can edit school settings.</p></div>'}
function saveSettings(e){e.preventDefault();db.school={name:s_name.value,id:s_id.value,division:s_div.value,region:s_reg.value};save();audit('UPDATE_SETTINGS');initUI();show('settings',document.querySelectorAll('.nav')[4]);flash('School settings saved.')}
function renderBackup(){document.getElementById('backup').innerHTML=`<div class="panel"><h2>Database Backup</h2><p class="muted">Your database is stored in this browser's local storage. Export a complete JSON backup regularly.</p><button class="primary" onclick="backup()">⬇ Download Full Backup</button></div><div class="panel"><h2>Restore Database</h2><p class="muted">Choose a backup JSON file created by this system. Restoring replaces the current local database.</p><input type="file" accept=".json,application/json" onchange="restore(event)"></div><div class="panel"><h2>Storage Information</h2><p>Documents: <b>${db.documents.length}</b> · Users: <b>${db.users.length}</b> · Audit records: <b>${db.audit.length}</b></p></div>`}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='KNHS_DocumentTrack_Backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();audit('BACKUP_DATABASE');flash('Backup downloaded.')}
function restore(e){let f=e.target.files[0];if(!f)return;if(!confirm('Restore this backup? Current records will be replaced.'))return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.documents||!x.users||!x.school)throw Error();db=x;save();currentUser=db.users.find(u=>u.username==='admin'&&u.active)||db.users.find(u=>u.active);initUI();show('dashboard',document.querySelector('.nav'));flash('Database restored.')}catch(err){alert('Invalid KNHS backup file.')}};r.readAsText(f)}
function exportCSV(){let rows=[['Control No','Reference No','Subject','Type','Sender','Originating Office','Date Received','Due Date','Priority','Status','Current Office','Custodian','Remarks']];db.documents.forEach(d=>rows.push([d.control,d.reference,d.subject,d.type,d.sender,d.origin,d.received,d.due,d.priority,d.status,d.office,d.custodian,d.remarks]));let csv=rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='KNHS_DocumentTrack_Registry.csv';a.click();audit('EXPORT_CSV');flash('CSV exported.')}
load();
document.getElementById('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script>
</body></html>
